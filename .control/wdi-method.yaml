# Written by wdi-method install/update. A trace, not a lockfile.
wdi_method: 0.6.32
bmad_method: 6.11.0
# The hosts this repo was installed for. `update` reuses this list; the skills and validate.py
# read `hosts:` to learn where each host reads skills, how a person types one, and whether the
# host has its own scheduler.
platforms:
  - claude-code
hosts:
  - id: claude-code
    name: "Claude Code"
    reads: [".claude/skills"]
    rules: ["AGENTS.md", "CLAUDE.md"]
    invoke: "/{skill}"
    manual_only: claude
    loop: {kind: command, how: "/loop {interval} {prompt}"}
engines:
  source: local
  package: mattpocock/skills
  lock: skills-lock.json
  model_invocation: enabled
  # sha256 of each SKILL.md AFTER the flag was stripped, first 12. Informational:
  # engines-invocable decides by looking for the flag, not by comparing these.
  skills:
    to-spec: 1ed6ee8fcdf7
    to-tickets: 03f8899a3358
    implement: d0d3ebc584dc
    tdd: 193b791c489d
    code-review: 3abbdfe52540
    domain-modeling: dd4c753a617b
installed_at: 2026-10-04
