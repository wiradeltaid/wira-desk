# components.yaml — SSOT for Product Components, containers, and Logical Components

product_components:
  - id: window-management
    mode: deep
    risk_accepted: medium
    risk_note: >-
      Global low-level keyboard hook, Administrator elevation, UIPI bypass,
      and real-time Win32 window enumeration.
    owns:
      - hook-command
      - window-focus-state
      - tray-health-state
      - arrangement-command
    containers: [daemon]
    g4_passed: true

  - id: settings
    mode: deep
    risk_accepted: medium
    risk_note: >-
      Writes local configuration, spawns elevated settings process,
      and signals daemon reload over IPC.
    owns:
      - user-shortcut-preference
      - onboarding-completion
      - auto-start-preference
      - user-mouse-preference
    containers: [settings]
    g4_passed: true

  - id: core
    mode: deep
    risk_accepted: medium
    risk_note: >-
      Pure sans-IO domain engine; must maintain zero regression against 591+
      existing Windows unit tests and strictly forbid unsafe code.
    owns:
      - geometry-planner
      - cycling-selection-engine
      - switcher-layout-model
      - input-sink-protocol
      - domain-commands
    containers: [core]
    g4_passed: true

platform_owns:
  - app-config
  - ipc-reload-signal
  - runtime-paths

containers:
  - id: daemon
    name: wiradesk.exe
    built: true
    crate: daemon
    serves: [window-management]

  - id: settings
    name: wiradesk-settings.exe
    built: true
    crate: settings
    serves: [settings]

  - id: core
    name: wiradesk-core
    built: true
    crate: core
    serves: [core]

logical_components:
  - id: LC-hook-thread
    type: service
    component: window-management
    container: daemon
    description: WH_KEYBOARD_LL interception, throttle, VM/RDP bypass evaluation.

  - id: LC-worker-thread
    type: service
    component: window-management
    container: daemon
    description: Z-order enumeration, focus transitions, snap and arrangement execution.

  - id: LC-tray-controller
    type: service
    component: window-management
    container: daemon
    description: Tray icon state machine, context menu, toast for Tier-3 hook failure.

  - id: LC-arrangement-engine
    type: service
    component: window-management
    container: daemon
    description: DPI-aware snap and stack layout planning.

  - id: LC-settings-shell
    type: ui-composite
    component: settings
    container: settings
    description: Slint settings dialog, theme, and navigation shell.

  - id: LC-config-writer
    type: service
    component: settings
    container: settings
    description: Atomic TOML persistence and IPC reload signal to daemon.

  - id: LC-shortcut-capturer
    type: control
    component: settings
    container: settings
    description: Listening-mode keyboard capture for shortcut fields.

  - id: LC-geometry-engine
    type: service
    component: core
    container: core
    description: Pure geometry layout planners for snap, thirds, stack, and virtual display coordinate spaces.

  - id: LC-cycling-state-machine
    type: service
    component: core
    container: core
    description: Window facts evaluation, directed cycling, and order selection state machines.

  - id: LC-switcher-layout-model
    type: service
    component: core
    container: core
    description: Pure layout and selection calculation for window switcher cards.

  - id: LC-input-sink
    type: service
    component: core
    container: core
    description: Instant shortcut matching, disposition & effect generator without blocking I/O.

